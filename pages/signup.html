<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora ERP — Create Account</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="page">
    <div class="left-panel"><div class="left-content">
      <h1 class="brand-title">NEXORA</h1>
      <p class="brand-subtitle">ERP Platform</p>
      <div class="tagline"><p class="tagline-line1">Run Your Business</p><p class="tagline-line2">Smarter And Faster</p></div>
    </div></div>
    <div class="right-panel"><div class="form-wrap">
      <div class="logo-row"><div class="logo-badge">N</div><span class="logo-text">NEXORA ERP</span></div>
      <h2 class="welcome">Create your account</h2>
      <p class="subtext">Start using Nexora with your employee workspace.</p>
      <form class="login-form" id="signupForm">
        <label class="field-label" for="name">Full name</label>
        <input class="field-input" type="text" id="name" name="name" placeholder="Enter your full name" required>
        <label class="field-label" for="email">Email address</label>
        <input class="field-input" type="email" id="email" name="email" placeholder="you@company.com" required>
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" placeholder="Create a password" minlength="6" required>
        <label class="field-label" for="confirmPassword">Confirm password</label>
        <input class="field-input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" minlength="6" required>
        <button type="submit" class="signin-btn">Create account</button>
        <p class="signup-text">Already have an account? <a href="../index.html" class="signup-link">Sign in</a></p>
      </form>
    </div></div>
  </div>
  <script src="../js/accounts.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
